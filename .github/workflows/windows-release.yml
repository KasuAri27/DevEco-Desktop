name: Windows Desktop Packages

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    name: Build Windows x64 packages
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: npm

      - name: Check tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($env:RELEASE_TAG -ne "v$version") {
            throw "Tag $env:RELEASE_TAG must match package.json version v$version."
          }

      - name: Install project dependencies
        run: npm ci

      - name: Prepare bundled Agent and Node.js runtimes
        run: npm run prepare:release-runtime

      - name: Build portable ZIP
        run: npm run package:win

      - name: Build NSIS installer
        run: npm run package:win:installer

      - name: Upload Windows packages
        uses: actions/upload-artifact@v4
        with:
          name: windows-packages
          path: |
            release/*.exe
            release/*.zip
          if-no-files-found: error
          retention-days: 14

  publish-release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Windows packages
        uses: actions/download-artifact@v4
        with:
          name: windows-packages
          path: release-assets

      - name: Create release and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          mapfile -t assets < <(find release-assets -maxdepth 1 -type f \( -name '*.exe' -o -name '*.zip' \) -print)
          if [ "${#assets[@]}" -lt 2 ]; then
            echo "Expected both an installer and a portable ZIP in the build artifact." >&2
            exit 1
          fi

          gh release create "$RELEASE_TAG" "${assets[@]}" \
            --title "DevEco Agent Desktop $RELEASE_TAG" \
            --generate-notes \
            --verify-tag \
            --latest
